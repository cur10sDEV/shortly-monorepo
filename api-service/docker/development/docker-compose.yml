services:
  short-url-service-api-server:
    container_name: short-url-service-api-server-dev
    build:
      context: ../../
      dockerfile: ./docker/development/Dockerfile.dev
    restart: always
    image: short-url-service-api-server-dev
    env_file: ../../.env.dev
    ports:
      - "8080:8080"
    volumes:
      - ../../src:/app/src
      - /app/node_modules
    depends_on:
      short-url-service-db:
        condition: service_healthy
    networks:
      - short-url-service-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${APP_PORT:-8080}/api/v1/health-check",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  short-url-service-db:
    container_name: short-url-service-db-dev
    image: postgres:18.1
    restart: always
    env_file: ./env/.env.db
    ports:
      - "5432:5432"
    volumes:
      - short-url-service-pg-data:/var/lib/postgresql
      - ../../scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - short-url-service-net
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${DB_USER:-postgres}",
          "-d",
          "${DB_DATABASE:-short-url}",
        ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  short-url-service-pg-data:

networks:
  short-url-service-net:
    driver: bridge
