services:
  short-url-service-api-server:
    container_name: short-url-service-api-server-prod
    build:
      context: ../../
      dockerfile: ./docker/production/Dockerfile
    restart: always
    image: short-url-service-api-server-prod
    env_file: ../../.env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    networks:
      - short-url-service-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${APP_PORT:-8080}/api/v1/health-check",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  short-url-service-net:
    driver: bridge
