services:
  shortly-ticket-service:
    container_name: shortly-ticket-service-api-server-prod
    build:
      context: ./ticket-service
      dockerfile: ./docker/production/Dockerfile
    restart: unless-stopped
    image: shortly-ticket-service-api-server-prod
    env_file: ./envs/.env.ticket
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    network_mode: host
    # networks:
    #   - shortly-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${APP_PORT:-5000}/api/v1/health-check",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  shortly-redirection-service:
    container_name: shortly-redirection-service-api-server-prod
    build:
      context: ./redirection-service
      dockerfile: ./docker/production/Dockerfile
    restart: unless-stopped
    image: shortly-redirection-api-server-prod
    env_file: ./envs/.env.redirection
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    network_mode: host
    # networks:
    #   - shortly-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${APP_PORT:-8000}/api/v1/health-check",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  shortly-api-service:
    container_name: shortly-api-service-prod
    build:
      context: ./api-service
      dockerfile: ./docker/production/Dockerfile
    restart: always
    image: shortly-api-service-prod
    env_file: ./envs/.env.api
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    network_mode: host
    # networks:
    #   - shortly-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${APP_PORT:-8080}/api/v1/health-check",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      sh -c "
      npx --yes @better-auth/cli generate --config ./dist/src/api/v1/lib/auth.js --yes &&
      npx --yes @better-auth/cli migrate --config ./dist/src/api/v1/lib/auth.js --yes &&
      npm run start:docker
      "
  shortly-kafka:
    container_name: shortly-kafka
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: shortly-cluster-001
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - shortly-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'test' | /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 5s
      retries: 10

  shortly-elasticsearch:
    container_name: shortly-elasticsearch
    image: elasticsearch:8.17.0
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - shortly-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  shortly-analytics-consumer:
    container_name: shortly-analytics-consumer
    build:
      context: ./analytics-consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./envs/.env.consumer
    network_mode: host
    depends_on:
      shortly-kafka:
        condition: service_healthy
      shortly-elasticsearch:
        condition: service_healthy

  shortly-frontend:
    container_name: shortly-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    network_mode: host

volumes:
  shortly-kafka-data:
  shortly-es-data:
